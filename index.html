<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Diabetes Monitoring Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0f1420; --card:#171d2e; --card2:#1d2438; --text:#e8ecf6; --muted:#8b93a7;
    --accent:#5aa9ff; --good:#37c98a; --warn:#f2b84b; --bad:#f2555a; --border:#2a3350;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(180deg,#0b0f1a,#0f1420 400px); color:var(--text); padding:24px 16px 60px;
  }
  .wrap{max-width:1080px; margin:0 auto;}
  header{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:12px; margin-bottom:20px;}
  h1{font-size:1.5rem; margin:0 0 4px;}
  .meta{color:var(--muted); font-size:0.85rem; line-height:1.5;}
  .status{display:flex; align-items:center; gap:10px; font-size:0.85rem; color:var(--muted);}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--good); box-shadow:0 0 8px var(--good);}
  .dot.loading{background:var(--warn); box-shadow:0 0 8px var(--warn); animation:pulse 1s infinite;}
  .dot.error{background:var(--bad); box-shadow:0 0 8px var(--bad); animation:none;}
  @keyframes pulse{50%{opacity:0.3;}}
  button#refreshBtn{
    background:var(--card2); color:var(--text); border:1px solid var(--border); border-radius:8px;
    padding:6px 12px; cursor:pointer; font-size:0.85rem;
  }
  button#refreshBtn:hover{border-color:var(--accent);}
  .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:24px;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 16px;}
  .card .label{color:var(--muted); font-size:0.75rem; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:6px;}
  .card .value{font-size:1.6rem; font-weight:600;}
  .card .sub{color:var(--muted); font-size:0.75rem; margin-top:4px;}
  .card.flag-good .value{color:var(--good);}
  .card.flag-warn .value{color:var(--warn);}
  .card.flag-bad .value{color:var(--bad);}
  .panel{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px; margin-bottom:20px;}
  .panel h2{font-size:1rem; margin:0 0 14px; color:var(--text);}
  table{width:100%; border-collapse:collapse; font-size:0.85rem;}
  th,td{text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); white-space:nowrap;}
  th{color:var(--muted); font-weight:500; font-size:0.75rem; text-transform:uppercase; letter-spacing:0.03em;}
  tr:last-child td{border-bottom:none;}
  td.num{font-variant-numeric:tabular-nums;}
  .pill{display:inline-block; padding:2px 8px; border-radius:999px; font-size:0.75rem; font-weight:600;}
  .pill.good{background:rgba(55,201,138,0.15); color:var(--good);}
  .pill.warn{background:rgba(242,184,75,0.15); color:var(--warn);}
  .pill.bad{background:rgba(242,85,90,0.15); color:var(--bad);}
  .notes{color:var(--muted); font-style:italic;}
  .chart-wrap{position:relative; height:280px;}
  footer{color:var(--muted); font-size:0.75rem; line-height:1.6; margin-top:8px;}
  .errbox{background:rgba(242,85,90,0.1); border:1px solid var(--bad); color:#ffb3b5; padding:16px; border-radius:10px; font-size:0.9rem; line-height:1.5;}
  .table-scroll{overflow-x:auto;}
  a{color:var(--accent);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Diabetes Monitoring Dashboard</h1>
      <div class="meta" id="metaLine">Loading patient info…</div>
    </div>
    <div class="status">
      <span class="dot loading" id="statusDot"></span>
      <span id="statusText">Connecting…</span>
      <button id="refreshBtn">Refresh now</button>
    </div>
  </header>

  <div id="errorArea"></div>

  <div class="cards" id="summaryCards"></div>

  <div class="panel">
    <h2>Blood sugar trend (mg/dL)</h2>
    <div class="chart-wrap"><canvas id="glucoseChart"></canvas></div>
  </div>

  <div class="panel">
    <h2>Blood pressure &amp; heart rate trend</h2>
    <div class="chart-wrap"><canvas id="vitalsChart"></canvas></div>
  </div>

  <div class="panel">
    <h2>Readings log</h2>
    <div class="table-scroll">
      <table id="readingsTable">
        <thead>
          <tr>
            <th>Date</th><th>Day</th><th>Check</th><th>Time</th>
            <th>Blood Sugar</th><th>Blood Pressure</th><th>Heart Rate</th><th>Notes</th>
          </tr>
        </thead>
        <tbody id="readingsBody"></tbody>
      </table>
    </div>
  </div>

  <footer id="footerNotes"></footer>
</div>

<script>
// ---- Config ----
const SHEET_ID = "1cXBKUykd5jM2GctrbWaO_LM-tyh5eKnOuj61HJmX1aw";
const SHEET_NAME = "Readings";
const REFRESH_MS = 60000; // auto-refresh every 60s

// Reference ranges (general guidance only, not medical advice)
const RANGES = {
  glucoseFasting: [80, 130],
  glucosePost: [0, 180],
  systolic: [0, 120],
  diastolic: [0, 80],
  hr: [60, 100]
};

let glucoseChart, vitalsChart;

function gvizUrl(){
  return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}&headers=0&_=${Date.now()}`;
}

function cellText(cell){
  if(!cell) return "";
  if(cell.f !== undefined && cell.f !== null) return String(cell.f).trim();
  if(cell.v !== undefined && cell.v !== null) return String(cell.v).trim();
  return "";
}

function normHeader(s){
  return s.replace(/\s+/g," ").trim().toLowerCase();
}

async function fetchSheet(){
  const res = await fetch(gvizUrl(), {cache:"no-store"});
  if(!res.ok) throw new Error("HTTP " + res.status);
  const text = await res.text();
  const match = text.match(/setResponse\(([\s\S]*)\);?\s*$/);
  if(!match) throw new Error("Unexpected response from Google Sheets");
  const json = JSON.parse(match[1]);
  if(json.status === "error"){
    throw new Error((json.errors && json.errors[0] && json.errors[0].detailed_message) || "Sheet query failed");
  }
  return json.table.rows.map(r => (r.c || []).map(cellText));
}

function extractMeta(rows){
  const meta = {patient:"", doctor:"", period:"", exported:""};
  for(const row of rows){
    const key = normHeader(row[0] || "");
    if(key === "patient") meta.patient = row[1] || "";
    else if(key === "doctor") meta.doctor = row[1] || "";
    else if(key === "period") meta.period = row[1] || "";
    else if(key === "exported") meta.exported = row[1] || "";
  }
  return meta;
}

function findHeaderRow(rows){
  for(let i=0;i<rows.length;i++){
    const first = normHeader(rows[i][0] || "");
    const second = normHeader(rows[i][1] || "");
    if(first === "date" && second === "day") return i;
  }
  return -1;
}

// Fixed column layout of the "Readings" sheet: Date, Day, Check, Time,
// Blood Sugar, Systolic, Diastolic, BP, Heart Rate, Notes.
// NOTE: we map by position, not by header text — Google's gviz feed
// coerces each column to a single type and silently nulls out any header
// text that doesn't match a numeric column's inferred type, so header-text
// lookup is unreliable for the Blood Sugar / Systolic / Diastolic / Heart
// Rate columns.
const COL = {date:0, day:1, check:2, time:3, sugar:4, sys:5, dia:6, bp:7, hr:8, notes:9};

function parseReadings(rows){
  const headerIdx = findHeaderRow(rows);
  if(headerIdx === -1) throw new Error("Could not find the readings header row in the sheet.");
  const idx = COL;

  const readings = [];
  for(let i=headerIdx+1;i<rows.length;i++){
    const row = rows[i];
    const dateVal = (row[idx.date] || "").trim();
    if(!dateVal) break; // blank row = end of data block
    if(normHeader(dateVal) === "summary") break;

    const num = (v) => { const n = parseFloat((v||"").replace(/[^\d.\-]/g,"")); return isNaN(n) ? null : n; };

    readings.push({
      date: dateVal,
      day: (row[idx.day] || "").trim(),
      check: (row[idx.check] || "").trim(),
      time: (row[idx.time] || "").trim(),
      sugar: num(row[idx.sugar]),
      systolic: num(row[idx.sys]),
      diastolic: num(row[idx.dia]),
      bp: (row[idx.bp] || "").trim(),
      hr: num(row[idx.hr]),
      notes: (row[idx.notes] || "").trim()
    });
  }
  return readings;
}

function parseDMY(dateStr){
  const m = dateStr.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(!m) return null;
  return new Date(parseInt(m[3]), parseInt(m[2])-1, parseInt(m[1]));
}

function parseTimeToMinutes(t){
  const m = t.match(/(\d{1,2}):(\d{2})\s*(am|pm)?/i);
  if(!m) return null;
  let h = parseInt(m[1]); const min = parseInt(m[2]);
  const ap = (m[3]||"").toLowerCase();
  if(ap === "pm" && h !== 12) h += 12;
  if(ap === "am" && h === 12) h = 0;
  return h*60+min;
}

function sortedByDateTime(readings){
  return readings.map((r, i) => ({...r, _i:i})).sort((a,b) => {
    const da = parseDMY(a.date), db = parseDMY(b.date);
    if(da && db && da.getTime() !== db.getTime()) return da - db;
    const ta = parseTimeToMinutes(a.time), tb = parseTimeToMinutes(b.time);
    if(ta !== null && tb !== null && ta !== tb) return ta - tb;
    return a._i - b._i;
  });
}

function stats(values){
  const v = values.filter(x => x !== null && !isNaN(x));
  if(!v.length) return {avg:null, min:null, max:null, n:0};
  const sum = v.reduce((a,b)=>a+b,0);
  return {avg: sum/v.length, min: Math.min(...v), max: Math.max(...v), n: v.length};
}

function flagGlucose(check, val){
  if(val === null) return "";
  const isFasting = /morning|fasting|first thing/i.test(check||"");
  const range = isFasting ? RANGES.glucoseFasting : RANGES.glucosePost;
  if(isFasting){
    if(val < range[0]) return "warn";
    if(val > range[1]) return "bad";
    return "good";
  }else{
    return val > range[1] ? "bad" : "good";
  }
}
function flagBp(sys, dia){
  if(sys === null && dia === null) return "";
  if((sys && sys >= 140) || (dia && dia >= 90)) return "bad";
  if((sys && sys >= 120) || (dia && dia >= 80)) return "warn";
  return "good";
}
function flagHr(hr){
  if(hr === null) return "";
  if(hr < 60 || hr > 100) return "warn";
  return "good";
}

function fmt1(n){ return n === null ? "–" : (Math.round(n*10)/10).toString(); }

function renderMeta(meta, readingsCount){
  const bits = [];
  if(meta.period) bits.push(`Period: ${meta.period}`);
  bits.push(`${readingsCount} readings`);
  document.getElementById("metaLine").textContent = bits.join(" · ");
}

function renderCards(readings){
  const sugar = stats(readings.map(r=>r.sugar));
  const sys = stats(readings.map(r=>r.systolic));
  const dia = stats(readings.map(r=>r.diastolic));
  const hr = stats(readings.map(r=>r.hr));

  const latest = readings[readings.length-1];

  const cards = [
    {label:"Latest reading", value: latest ? `${latest.sugar ?? "–"} mg/dL` : "–", sub: latest ? `${latest.day} · ${latest.check}` : "", flag: latest ? flagGlucose(latest.check, latest.sugar) : ""},
    {label:"Avg blood sugar", value: fmt1(sugar.avg) + " mg/dL", sub: `min ${sugar.min ?? "–"} · max ${sugar.max ?? "–"}`, flag: sugar.avg && sugar.avg > 180 ? "bad" : sugar.avg && sugar.avg > 130 ? "warn" : "good"},
    {label:"Avg blood pressure", value: `${fmt1(sys.avg)}/${fmt1(dia.avg)}`, sub: `mmHg · n=${sys.n}`, flag: flagBp(sys.avg, dia.avg)},
    {label:"Avg heart rate", value: fmt1(hr.avg) + " bpm", sub: `min ${hr.min ?? "–"} · max ${hr.max ?? "–"}`, flag: flagHr(hr.avg)},
  ];

  const el = document.getElementById("summaryCards");
  el.innerHTML = cards.map(c => `
    <div class="card ${c.flag ? "flag-"+c.flag : ""}">
      <div class="label">${c.label}</div>
      <div class="value">${c.value}</div>
      <div class="sub">${c.sub}</div>
    </div>
  `).join("");
}

function renderTable(readings){
  const body = document.getElementById("readingsBody");
  const rows = [...readings].reverse(); // most recent first
  body.innerHTML = rows.map(r => {
    const gf = flagGlucose(r.check, r.sugar);
    const bf = flagBp(r.systolic, r.diastolic);
    const hf = flagHr(r.hr);
    return `<tr>
      <td>${r.date}</td>
      <td>${r.day}</td>
      <td>${r.check}</td>
      <td class="num">${r.time || "–"}</td>
      <td class="num">${r.sugar !== null ? `<span class="pill ${gf||''}">${r.sugar}</span>` : "–"}</td>
      <td class="num">${r.bp ? `<span class="pill ${bf||''}">${r.bp}</span>` : "–"}</td>
      <td class="num">${r.hr !== null ? `<span class="pill ${hf||''}">${r.hr}</span>` : "–"}</td>
      <td class="notes">${r.notes || ""}</td>
    </tr>`;
  }).join("");
}

function renderCharts(readings){
  const labels = readings.map(r => `${r.date}${r.time ? " " + r.time : ""}\n${r.check}`);

  if(glucoseChart) glucoseChart.destroy();
  const ctx1 = document.getElementById("glucoseChart").getContext("2d");
  glucoseChart = new Chart(ctx1, {
    type:"line",
    data:{
      labels,
      datasets:[{
        label:"Blood sugar (mg/dL)",
        data: readings.map(r=>r.sugar),
        borderColor:"#5aa9ff",
        backgroundColor:"rgba(90,169,255,0.12)",
        fill:true, tension:0.25, spanGaps:true, pointRadius:3
      }]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{labels:{color:"#8b93a7"}}},
      scales:{
        x:{ticks:{color:"#8b93a7", maxRotation:60, minRotation:60, autoSkip:true}, grid:{color:"#2a3350"}},
        y:{ticks:{color:"#8b93a7"}, grid:{color:"#2a3350"}, suggestedMin:60}
      }
    }
  });

  if(vitalsChart) vitalsChart.destroy();
  const ctx2 = document.getElementById("vitalsChart").getContext("2d");
  vitalsChart = new Chart(ctx2, {
    type:"line",
    data:{
      labels,
      datasets:[
        {label:"Systolic", data: readings.map(r=>r.systolic), borderColor:"#f2555a", backgroundColor:"transparent", tension:0.25, spanGaps:true, pointRadius:3},
        {label:"Diastolic", data: readings.map(r=>r.diastolic), borderColor:"#f2b84b", backgroundColor:"transparent", tension:0.25, spanGaps:true, pointRadius:3},
        {label:"Heart rate", data: readings.map(r=>r.hr), borderColor:"#37c98a", backgroundColor:"transparent", tension:0.25, spanGaps:true, pointRadius:3}
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{labels:{color:"#8b93a7"}}},
      scales:{
        x:{ticks:{color:"#8b93a7", maxRotation:60, minRotation:60, autoSkip:true}, grid:{color:"#2a3350"}},
        y:{ticks:{color:"#8b93a7"}, grid:{color:"#2a3350"}}
      }
    }
  });
}

function setStatus(state, text){
  const dot = document.getElementById("statusDot");
  dot.className = "dot" + (state ? " " + state : "");
  document.getElementById("statusText").textContent = text;
}

function showError(msg){
  document.getElementById("errorArea").innerHTML = `<div class="errbox panel">
    <strong>Couldn't load live data.</strong><br/>${msg}<br/><br/>
    If this is a permissions error, make sure the Google Sheet is shared as
    <em>"Anyone with the link – Viewer"</em>.
  </div>`;
}

async function refresh(){
  setStatus("loading", "Syncing…");
  try{
    const rows = await fetchSheet();
    const meta = extractMeta(rows);
    const readings = sortedByDateTime(parseReadings(rows));
    document.getElementById("errorArea").innerHTML = "";
    renderMeta(meta, readings.length);
    renderCards(readings);
    renderCharts(readings);
    renderTable(readings);
    const now = new Date();
    setStatus("", "Live · synced " + now.toLocaleTimeString());
    document.getElementById("footerNotes").innerHTML =
      `Reference ranges (general guidance, not a diagnosis — targets set by your doctor): fasting/pre-meal glucose ~80–130 mg/dL,
       2 hrs post-meal below ~180 mg/dL · blood pressure normal below 120/80 · resting heart rate 60–100 bpm.
       Data auto-refreshes every ${REFRESH_MS/1000}s directly from the Google Sheet.`;
  }catch(err){
    console.error(err);
    setStatus("error", "Sync failed");
    showError(err.message || String(err));
  }
}

document.getElementById("refreshBtn").addEventListener("click", refresh);
refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
